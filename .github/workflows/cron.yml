name: Atualizar Indicadores B3

on:
  schedule:
    # Coleta e grava no banco a cada 30 min, de segunda a sexta, das 10h às 19h (Brasília).
    # O GitHub costuma atrasar ou pular execuções; por isso o servidor também coleta
    # sozinho durante o pregão (rota /api/saude, chamada a cada 10 min por manter_acordado.yml).
    - cron: '*/30 13-22 * * 1-5'
  workflow_dispatch: # Permite execução manual pelo GitHub

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar atualização
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cron_updater.py