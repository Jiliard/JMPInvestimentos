name: Manter servidor acordado

# O plano gratuito do Render "dorme" após ~15 min sem acesso, e acordar leva de
# 30 a 60 s. Este acesso a cada 10 min mantém o servidor ligado.
# Obs.: o GitHub pode atrasar execuções agendadas em alguns minutos e desativa
# agendamentos após 60 dias sem commits no repositório.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Acessar a API
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 120 https://jmpinvestimentos.onrender.com/api/saude
